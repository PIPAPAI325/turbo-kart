<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>极速卡丁车 · Turbo Kart Racing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1d3a; }
  body { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  #app { position: fixed; inset: 0; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; border: none; outline: none; }

  /* ---------- 主菜单 ---------- */
  #menu {
    position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: linear-gradient(180deg, rgba(43,120,215,.78) 0%, rgba(120,190,255,.55) 45%, rgba(207,238,255,.42) 70%, rgba(126,200,80,.55) 71%, rgba(70,140,45,.72) 100%);
  }
  #menu .title {
    font-size: clamp(42px, 9vw, 88px); font-weight: 900; letter-spacing: 4px; line-height: 1;
    color: #ffd23f; -webkit-text-stroke: 3px #21365a;
    text-shadow: 0 6px 0 #e07b00, 0 12px 24px rgba(0,0,0,.35);
    transform: rotate(-2deg); text-align: center;
  }
  #menu .subtitle { font-size: clamp(14px, 2.4vw, 20px); color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.4); letter-spacing: 6px; }
  .panel {
    background: rgba(15, 32, 64, .82); border: 3px solid rgba(255,255,255,.25);
    border-radius: 18px; padding: 18px 26px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    display: flex; flex-direction: column; gap: 12px; align-items: center; backdrop-filter: blur(4px);
  }
  .panel h3 { font-size: 15px; color: #9fd4ff; letter-spacing: 3px; font-weight: 700; }
  #colorRow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); position: relative; transition: transform .12s; }
  .swatch.sel { border-color: #ffd23f; transform: scale(1.18); box-shadow: 0 0 14px #ffd23f88; }
  #diffRow { display: flex; gap: 10px; }
  #trackRow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .diff-btn { padding: 8px 22px; border-radius: 12px; background: rgba(255,255,255,.14); color: #cfe6ff; font-size: 16px; font-weight: 700; border: 2px solid transparent; }
  .diff-btn.sel { background: #ffd23f; color: #21365a; border-color: #fff; }
  #startBtn {
    margin-top: 4px; padding: 16px 64px; font-size: 26px; font-weight: 900; letter-spacing: 8px;
    color: #21365a; background: linear-gradient(180deg, #ffe066, #ffb020);
    border-radius: 999px; border-bottom: 6px solid #b96b00; transition: transform .1s;
    text-shadow: 0 1px 0 #fff6; box-shadow: 0 10px 26px rgba(0,0,0,.35);
  }
  #startBtn:active { transform: translateY(3px); }
  #menu .help { font-size: 13px; color: #eaf5ff; text-align: center; line-height: 1.9; opacity: .95; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  #menu .help b { color: #ffd23f; }

  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
  #posBox { position: absolute; left: 22px; top: 16px; text-shadow: 0 3px 8px rgba(0,0,0,.5); }
  #posVal { font-size: 58px; font-weight: 900; font-style: italic; color: #ffd23f; -webkit-text-stroke: 2px #21365a; line-height: 1; }
  #posSuffix { font-size: 24px; font-weight: 900; }
  #lapVal { position: absolute; left: 24px; top: 84px; font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.55); }
  #timeBox { position: absolute; right: 22px; top: 14px; text-align: right; text-shadow: 0 2px 6px rgba(0,0,0,.55); }
  #timeVal { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #bestLapVal { font-size: 14px; color: #cfe6ff; font-variant-numeric: tabular-nums; }
  #speedBox { position: absolute; right: 24px; bottom: 20px; text-align: right; text-shadow: 0 3px 8px rgba(0,0,0,.5); }
  #speedVal { font-size: 64px; font-weight: 900; font-style: italic; line-height: 1; font-variant-numeric: tabular-nums; }
  #speedUnit { font-size: 16px; color: #cfe6ff; font-weight: 700; letter-spacing: 2px; }
  #boostBar { position: absolute; right: 24px; bottom: 108px; width: 190px; height: 14px; border-radius: 8px; background: rgba(0,0,0,.4); border: 2px solid rgba(255,255,255,.4); overflow: hidden; }
  #boostFill { height: 100%; width: 0%; border-radius: 6px; background: linear-gradient(90deg, #ff9f1c, #ff4040, #ffd23f); background-size: 200% 100%; animation: boostFlow 1s linear infinite; }
  @keyframes boostFlow { from { background-position: 0 0; } to { background-position: -200% 0; } }
  #minimap { position: absolute; left: 20px; bottom: 20px; width: 170px; height: 150px; opacity: .92; }
  #wrongway {
    position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%);
    font-size: 40px; font-weight: 900; color: #ff5252; text-shadow: 0 3px 10px rgba(0,0,0,.6);
    animation: blink .5s steps(2) infinite; letter-spacing: 4px;
  }
  @keyframes blink { 50% { opacity: .15; } }
  #driftTip { position: absolute; left: 50%; bottom: 26%; transform: translateX(-50%); font-size: 26px; font-weight: 900; color: #ffd23f; text-shadow: 0 2px 8px rgba(0,0,0,.6); letter-spacing: 2px; }

  /* ---------- 倒计时 ---------- */
  #countdown {
    position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 30;
    font-size: 150px; font-weight: 900; color: #ffd23f; -webkit-text-stroke: 4px #21365a;
    text-shadow: 0 10px 30px rgba(0,0,0,.4); pointer-events: none;
  }
  #countdown.pop { animation: pop .9s ease-out; }
  @keyframes pop { 0% { transform: translate(-50%,-50%) scale(2.2); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(-50%,-50%) scale(.9); opacity: 0; } }

  /* ---------- 结算 / 暂停 ---------- */
  #results, #pause {
    position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; background: rgba(8, 18, 38, .72);
  }
  #results h2, #pause h2 { font-size: 44px; font-weight: 900; color: #ffd23f; text-shadow: 0 4px 12px rgba(0,0,0,.5); letter-spacing: 6px; }
  #resultTable { border-collapse: collapse; min-width: 380px; }
  #resultTable td { padding: 8px 18px; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,.14); font-variant-numeric: tabular-nums; }
  #resultTable tr.me td { color: #ffd23f; font-weight: 900; }
  .big-btn { padding: 13px 44px; font-size: 20px; font-weight: 900; letter-spacing: 4px; color: #21365a; background: linear-gradient(180deg, #ffe066, #ffb020); border-radius: 999px; border-bottom: 5px solid #b96b00; }
  .ghost-btn { padding: 12px 36px; font-size: 18px; font-weight: 700; letter-spacing: 3px; color: #fff; background: rgba(255,255,255,.15); border-radius: 999px; border: 2px solid rgba(255,255,255,.35); }

  /* ---------- 触屏控制 ---------- */
  #touch { position: absolute; inset: 0; z-index: 25; pointer-events: none; }
  .tbtn {
    position: absolute; pointer-events: auto; width: 74px; height: 74px; border-radius: 50%;
    background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.45); color: #fff;
    font-size: 15px; font-weight: 900; letter-spacing: 1px; backdrop-filter: blur(2px);
  }
  .tbtn:active, .tbtn.on { background: rgba(255, 210, 63, .55); }
  #tLeft { left: 20px; bottom: 90px; } #tRight { left: 108px; bottom: 90px; }
  #tGas { right: 20px; bottom: 150px; } #tBrake { right: 20px; bottom: 62px; }
  #tDrift { right: 108px; bottom: 106px; }

  /* ---------- 声音按钮 / 错误提示 ---------- */
  #soundBtn {
    position: absolute; right: 16px; top: 60px; z-index: 45; padding: 7px 14px; font-size: 13px;
    border-radius: 999px; background: rgba(15,32,64,.7); color: #cfe6ff; border: 2px solid rgba(255,255,255,.3);
  }
  #err {
    position: absolute; left: 10px; top: 10px; z-index: 99; max-width: 90%; max-height: 60%;
    overflow: auto; white-space: pre-wrap; background: rgba(120, 0, 0, .88); color: #fff;
    font: 12px/1.5 Consolas, monospace; padding: 10px; border-radius: 8px; display: none;
  }
  #loading { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: #0b1d3a; font-size: 22px; letter-spacing: 4px; color: #9fd4ff; }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="loading">加载中…</div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="posBox"><span id="posVal">8</span><span id="posSuffix">th</span></div>
    <div id="lapVal">第 1/3 圈</div>
    <div id="timeBox"><div id="timeVal">00:00.0</div><div id="bestLapVal"></div></div>
    <div id="speedBox"><div id="speedVal">0</div><div id="speedUnit">km/h</div></div>
    <div id="boostBar"><div id="boostFill"></div></div>
    <canvas id="minimap" width="340" height="300"></canvas>
    <div id="wrongway" class="hidden">逆行！请调头</div>
    <div id="driftTip" class="hidden"></div>
  </div>

  <div id="countdown" class="hidden"></div>

  <!-- 主菜单 -->
  <div id="menu">
    <div class="title">极速卡丁车</div>
    <div class="subtitle">TURBO KART RACING</div>
    <div class="panel">
      <h3>选择车手涂装</h3>
      <div id="colorRow"></div>
      <h3>AI 难度</h3>
      <div id="diffRow">
        <button class="diff-btn" data-d="0">简单</button>
        <button class="diff-btn sel" data-d="1">普通</button>
        <button class="diff-btn" data-d="2">困难</button>
      </div>
      <h3>选择地图</h3>
      <div id="trackRow"></div>
    </div>
    <button id="startBtn">开始比赛</button>
    <div class="help">
      <b>W / ↑</b> 加速　<b>S / ↓</b> 刹车·倒车　<b>A D / ← →</b> 转向　<b>Shift</b> 漂移(集气加速)　<b>Esc</b> 暂停<br>
      撞上护栏会掉速，漂移 1.2 秒以上松开可触发迷你涡轮！
    </div>
  </div>

  <!-- 结算 -->
  <div id="results" class="hidden">
    <h2>比赛结束</h2>
    <table id="resultTable"><tbody id="resultRows"></tbody></table>
    <button id="againBtn" class="big-btn">再来一局</button>
  </div>

  <!-- 暂停 -->
  <div id="pause" class="hidden">
    <h2>暂停中</h2>
    <button id="resumeBtn" class="big-btn">继续比赛</button>
    <button id="restartBtn" class="ghost-btn">重新开始</button>
  </div>

  <!-- 触屏按钮（移动端自动显示） -->
  <div id="touch" class="hidden">
    <button class="tbtn" id="tLeft">◀</button>
    <button class="tbtn" id="tRight">▶</button>
    <button class="tbtn" id="tGas">加速</button>
    <button class="tbtn" id="tBrake">刹车</button>
    <button class="tbtn" id="tDrift">漂移</button>
  </div>

  <button id="soundBtn">声音: 开</button>
  <pre id="err"></pre>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
